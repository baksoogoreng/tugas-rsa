{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-9">
        <div class="card-custom">
            <div class="row g-0">
                <!-- Kiri: Info -->
                <div class="col-md-5 d-flex flex-column justify-content-center align-items-center text-center p-5 bg-slate text-white">
                    <h2 class="fw-bold mb-3">Halo, Teman!</h2>
                    <p class="mb-4">Daftarkan tim Anda dan mulailah perjalanan kriptografi bersama kami.</p>
                    <a href="/register" class="custom-btn-outline">SIGN UP</a>
                </div>

                <!-- Kanan: Form Login -->
                <div class="col-md-7 d-flex flex-column justify-content-center p-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-slate">Sign in to Website</h2>
                    </div>
                    <form method="POST" action="/login">
                        <div class="mb-4">
                            <input type="password" class="form-control text-center custom-input" id="token" name="token" placeholder="Token Akses Tim" required>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="custom-btn">SIGN IN</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
