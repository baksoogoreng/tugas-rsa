{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5" style="min-height: 80vh;">
    <div class="col-md-10">
        <div class="card-custom">
            <div class="row g-0">
                <!-- Kiri: Form Register -->
                <div class="col-md-7 p-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-slate">Create Account</h2>
                    </div>
                    <form method="POST" action="/register">
                        <div class="mb-3">
                            <input type="text" class="form-control custom-input" id="team_name" name="team_name" placeholder="Nama Tim" value="{{ form.team_name if form else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control custom-input" id="leader" name="leader" placeholder="Nama Ketua" value="{{ form.leader if form else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control custom-input" id="email" name="email" placeholder="Email Aktif" value="{{ form.email if form else '' }}" required>
                        </div>
                        <div class="mb-4">
                            <input type="text" class="form-control custom-input" id="campus" name="campus" placeholder="Asal Kampus" value="{{ form.campus if form else '' }}" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="custom-btn">SIGN UP</button>
                        </div>
                    </form>
                </div>

                <!-- Kanan: Info -->
                <div class="col-md-5 d-flex flex-column justify-content-center align-items-center text-center p-5 bg-slate text-white">
                    <h2 class="fw-bold mb-3">Welcome Back!</h2>
                    <p class="mb-4">Untuk tetap terhubung dengan kami, silakan login dengan token tim Anda.</p>
                    <a href="/login" class="custom-btn-outline">SIGN IN</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
